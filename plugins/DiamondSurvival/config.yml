# DiamondSurvival Configuration

tracker:
  url: https://mabeltracker.up.railway.app
# Goal: how many diamonds to win
goal: 50

# Overlay web server port (for OBS Browser Source)
overlay-port: 6971

# Scan settings
scan:
  radius: 30
  duration-seconds: 10

# Warp settings (random teleport spread distance)
warp:
  spread: 500
  min-spread: 100

# Countdown when diamonds reach goal (seconds)
countdown-seconds: 10
